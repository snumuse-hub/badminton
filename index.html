<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 경기 분석</title>
<style>
:root{--bg:#0b1220;--card:#0f1c33;--line:#2a4a72;--text:#e8f1ff;--muted:#8aa3c4;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;}
h1{font-size:clamp(24px,6vw,36px);text-align:center;letter-spacing:.5px;}
h1 span{background:linear-gradient(90deg,#36d1ff,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent;}
p.sub{color:var(--muted);text-align:center;margin:10px 0 32px;font-size:15px;line-height:1.6;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:760px;}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
a.sport{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;}
a.sport::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,var(--c) 0%,transparent 55%);opacity:.18;pointer-events:none;}
a.sport:hover,a.sport:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c);outline:none;}
.emoji{font-size:56px;line-height:1;}
.name{font-size:26px;font-weight:800;margin:14px 0 6px;color:var(--c);}
.desc{font-size:14px;color:var(--muted);line-height:1.6;}
.go{margin-top:18px;display:inline-block;font-size:14px;font-weight:700;color:var(--c);}
.badminton{--c:#36d1ff;}
.tt{--c:#ff7a45;}
.feat{max-width:760px;width:100%;margin-top:28px;color:var(--muted);font-size:13px;line-height:1.8;text-align:center;}
</style>
</head>
<body>
  <h1>🎯 <span>AI 경기 분석</span></h1>
  <p class="sub">종목을 고르세요.<br>카메라로 찍거나 영상을 올리면 선수 움직임을 실시간으로 분석해요.</p>

  <div class="grid">
    <a class="sport badminton" href="analyze.html?sport=badminton">
      <div class="emoji">🏸</div>
      <div class="name">배드민턴</div>
      <div class="desc">코트 모서리 4곳으로 보정<br>선수 이동 거리 · 속도 · 코트 맵</div>
      <span class="go">분석 시작 →</span>
    </a>
    <a class="sport tt" href="analyze.html?sport=tabletennis">
      <div class="emoji">🏓</div>
      <div class="name">탁구</div>
      <div class="desc">영상 속 공을 찾아 스트로크 자동 카운트<br>공 바운드 위치 표시 · 선수 이동 분석</div>
      <span class="go">분석 시작 →</span>
    </a>
  </div>

  <div class="feat">실시간 카메라 · 영상 업로드 · 선수 최대 4명 추적 · 랠리 시간과 샷 기록</div>
</body>
</html>
